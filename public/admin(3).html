<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMI BD V2 Admin</title>
<style>
body{margin:0;background:#f4f8fc;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#10243e}.top{background:#061e36;color:#fff;padding:18px}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e4edf5;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd8e5;border-radius:8px;box-sizing:border-box}button{border:0;border-radius:8px;padding:10px 14px;background:#087cf0;color:#fff;font-weight:700;cursor:pointer}.green{background:#17c95a}.red{background:#e5484d}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tabs button.active{background:#061e36}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #e5edf5;border-radius:11px;margin:8px 0}.muted{color:#718096}.hidden{display:none}.pill{padding:5px 8px;background:#edf4fa;border-radius:20px;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="top"><div class="wrap"><h2>🛡️ Real Money Income BD — V2 Admin</h2><span id="adminEmail"></span></div></div><div class="wrap">
<div id="loginBox" class="card"><h3>Admin Login</h3><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="app" class="hidden"><div class="card"><button onclick="logout()">Logout</button> <button onclick="refreshAll()">Refresh</button></div><div class="tabs"><button class="active" data-tab="users">Users</button><button data-tab="tx">Transactions</button><button data-tab="claims">Task Claims</button></div>
<div id="users" class="tab"><div class="card"><h3>Users</h3><input id="search" placeholder="Search name, email or UID" oninput="renderUsers()"><div id="userList"></div></div></div>
<div id="tx" class="tab hidden"><div class="card"><h3>Deposit / Withdraw Requests</h3><div id="txList"></div></div></div>
<div id="claims" class="tab hidden"><div class="card"><h3>Task Claims</h3><div id="claimList"></div></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
const firebaseConfig = {  apiKey: "AIzaSyAFUC6eAedI7IVTUKT_BYCefjfjRd_PyeE",  authDomain: "real-money-income-bd.firebaseapp.com",  databaseURL: "https://real-money-income-bd-default-rtdb.firebaseio.com",  projectId: "real-money-income-bd",  storageBucket: "real-money-income-bd.firebasestorage.app",  messagingSenderId: "834454988740",  appId: "1:834454988740:web:bada9e5f19d733e121e691"};
const auth=getAuth(initializeApp(firebaseConfig));let token="",users=[];
const $=id=>document.getElementById(id);
async function api(url,opt={}){const h=opt.headers||{};h.Authorization="Bearer "+token;h["Content-Type"]="application/json";const r=await fetch(url,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("msg").textContent=e.message}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u)return;token=await u.getIdToken();try{await refreshAll();$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");$("adminEmail").textContent=u.email}catch(e){$("msg").textContent=e.message;signOut(auth)}});
window.refreshAll=async()=>{users=await api("/api/admin/users");renderUsers();renderTx(await api("/api/admin/transactions"));renderClaims(await api("/api/admin/task-claims"))};
window.renderUsers=()=>{const q=($("search").value||"").toLowerCase();$("userList").innerHTML=users.filter(u=>JSON.stringify(u).toLowerCase().includes(q)).map(u=>`<div class="row"><div><b>${esc(u.name||"User")}</b> ${u.verified?"☑️":""}<br><span class="muted">${esc(u.email||"")}<br>UID: ${esc(u.uid)}<br>Balance: ৳${Number(u.balance||0).toFixed(2)} · ${esc(u.status||"active")}</span></div><div><input id="bal_${u.uid}" type="number" step="0.01" placeholder="New balance"><button class="green" onclick="setBalance('${u.uid}')">Set Balance</button> <button onclick="verify('${u.uid}',${!u.verified})">${u.verified?"Remove Tick":"Verify"}</button> <button class="red" onclick="block('${u.uid}','${u.status||"active"}')">${u.status==="blocked"?"Unblock":"Block"}</button></div></div>`).join("")||"<p>No users.</p>"};
window.setBalance=async uid=>{const v=Number($("bal_"+uid).value);if(!Number.isFinite(v)||v<0)return alert("Invalid balance");await api("/api/admin/users/"+uid,{method:"PATCH",body:JSON.stringify({balance:v})});await refreshAll()};
window.verify=async(uid,v)=>{await api("/api/admin/users/"+uid,{method:"PATCH",body:JSON.stringify({verified:v})});await refreshAll()};
window.block=async(uid,s)=>{await api("/api/admin/users/"+uid,{method:"PATCH",body:JSON.stringify({status:s==="blocked"?"active":"blocked"})});await refreshAll()};
function renderTx(a){$("txList").innerHTML=a.map(t=>`<div class="row"><div><b>${esc(t.type)}</b> — ৳${Number(t.amount||0).toFixed(2)}<br><span class="muted">User: ${esc(t.uid)} · ${esc(t.method||"")} · ${esc(t.reference||"")}</span></div><div><span class="pill">${esc(t.status||"pending")}</span> ${t.status==="pending"?`<button class="green" onclick="reviewTx('${t.uid}','${t.id}','approved')">Approve</button> <button class="red" onclick="reviewTx('${t.uid}','${t.id}','rejected')">Reject</button>`:""}</div></div>`).join("")||"<p>No transactions.</p>"}
window.reviewTx=async(uid,id,action)=>{await api(`/api/admin/transactions/${uid}/${id}`,{method:"PATCH",body:JSON.stringify({action})});await refreshAll()};
function renderClaims(a){$("claimList").innerHTML=a.map(c=>`<div class="row"><div><b>${esc(c.title)}</b> — ৳${Number(c.reward||0).toFixed(2)}<br><span class="muted">User: ${esc(c.uid)}</span></div><div><span class="pill">${esc(c.status||"pending")}</span> ${c.status==="pending"?`<button class="green" onclick="reviewClaim('${c.uid}','${c.id}','approved')">Approve</button> <button class="red" onclick="reviewClaim('${c.uid}','${c.id}','rejected')">Reject</button>`:""}</div></div>`).join("")||"<p>No claims.</p>"}
window.reviewClaim=async(uid,id,action)=>{await api(`/api/admin/task-claims/${uid}/${id}`,{method:"PATCH",body:JSON.stringify({action})});await refreshAll()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));b.classList.add("active");$(b.dataset.tab).classList.remove("hidden")});
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
